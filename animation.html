<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#ffffff"><title>Reward animation</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}main{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 24px}.phone{display:block;position:relative;margin:0;padding:0;width:min(320px,calc(100vw - 48px),calc((100svh - 64px)*.4620853));aspect-ratio:390/844;overflow:hidden;border:2px solid #171717;border-radius:28px;background:#fcfefd;box-shadow:0 16px 48px #00000015;cursor:pointer}.phone:focus-visible{outline:3px solid #3895ff;outline-offset:6px}video{display:block;width:100%;height:100%;object-fit:cover}#status{position:absolute;inset:0;display:grid;place-items:center;font:13px/1.5 Arial,sans-serif;color:#777;padding:16px;text-align:center}[hidden]{display:none!important}</style></head><body><main><button class="phone" id="phone" aria-label="Replay reward animation"><video id="motion" muted playsinline loop preload="auto" disablepictureinpicture aria-label="Payment success, P coin flip, and 2× reward animation"></video><span id="status" role="status">Opening…</span></button></main><script>
const video=document.getElementById('motion'),phone=document.getElementById('phone'),status=document.getElementById('status');let ready=false,inView=true;
function playFromStart(){if(!ready)return;video.pause();video.currentTime=0;if(inView&&!document.hidden)video.play().catch(()=>{});}
phone.addEventListener('click',playFromStart);document.addEventListener('visibilitychange',playFromStart);
new IntersectionObserver(entries=>{const visible=entries[0].isIntersecting;if(visible!==inView){inView=visible;playFromStart();}},{threshold:0}).observe(phone);
(async()=>{try{const secret=new URLSearchParams(location.hash.slice(1)).get('key');if(!secret){status.textContent='Please open the complete animation link.';return;}
const decode=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',decode(secret),{name:'AES-GCM'},false,['decrypt']);const response=await fetch('./motion.bin',{cache:'no-store'});if(!response.ok)throw new Error('load');const bytes=new Uint8Array(await response.arrayBuffer());const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));const data=await new Response(stream).json();video.poster=URL.createObjectURL(new Blob([decode(data.poster)],{type:'image/png'}));video.src=URL.createObjectURL(new Blob([decode(data.video)],{type:'video/mp4'}));video.muted=true;ready=true;status.hidden=true;playFromStart();}catch(e){status.textContent='Please use the complete original animation link.';}})();
</script></body></html>
