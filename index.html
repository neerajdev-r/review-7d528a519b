<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>Private review</title><style>html,body{height:100%;margin:0;background:#fff;font-family:Arial,sans-serif;color:#666}#status{display:grid;place-items:center;min-height:100dvh;font-size:14px;padding:24px;box-sizing:border-box;text-align:center}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}[hidden]{display:none!important}</style></head><body><div id="status" role="status">Opening…</div><iframe id="review" title="Case study" hidden></iframe><script>
(async()=>{const status=document.getElementById('status');try{
 const fragment=new URLSearchParams(location.hash.slice(1)),secret=fragment.get('key');
 if(!secret){status.textContent='Please open the complete review link provided in your email or PDF.';return;}
 const bytes=Uint8Array.from(atob(secret.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['decrypt']);
 const response=await fetch('./content.bin',{cache:'no-store'});if(!response.ok)throw new Error('load');
 const data=new Uint8Array(await response.arrayBuffer());
 const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));
 const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
 const payload=await new Response(stream).json();let html=payload.html;for(const [path,asset] of Object.entries(payload.assets)){const bytes=Uint8Array.from(atob(asset.data),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:asset.type}));html=html.split(path).join(url);}const review=document.getElementById('review');review.srcdoc=html;review.hidden=false;status.hidden=true;document.title='PayPay Credit — Case study';
}catch(e){status.textContent='This review could not be opened. Please use the complete original link.';}})();
</script></body></html>
